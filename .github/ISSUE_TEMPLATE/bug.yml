name: Bug
description: Something in Chinijo does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happens
      description: Steps to reproduce, what happened and what you expected.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Chinijo version and Moodle version.
    validations:
      required: true
